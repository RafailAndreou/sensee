name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
        working-directory: raspi/web
  engine:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: raspi/requirements-test.txt
      - run: python -m pip install -r raspi/requirements-test.txt
      - run: python -m unittest discover -s tests -p "test_*.py"
        working-directory: raspi
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: mobile/surface_controller
      - run: flutter test
        working-directory: mobile/surface_controller
      - run: flutter analyze --no-fatal-infos
        working-directory: mobile/surface_controller
