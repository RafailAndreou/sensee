<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 24" width="120" height="48">
  <title>Dashboard Icons</title>
  <desc>Vector icons for the dashboard, in inactive (grey) and active (cyan-blue) states.</desc>

  <g id="dashboard-inactive" fill="#A0A0A0">
    <rect x="2" y="2" width="9" height="9" rx="1" />
    <rect x="13" y="2" width="9" height="9" rx="1" />
    <rect x="2" y="13" width="9" height="9" rx="1" />
    <rect x="13" y="13" width="9" height="9" rx="1" />
  </g>

  <g id="dashboard-active" fill="#00A0FF" transform="translate(30, 0)">
    <rect x="2" y="2" width="9" height="9" rx="1" />
    <rect x="13" y="2" width="9" height="9" rx="1" />
    <rect x="2" y="13" width="9" height="9" rx="1" />
    <rect x="13" y="13" width="9" height="9" rx="1" />
  </g>
</svg>